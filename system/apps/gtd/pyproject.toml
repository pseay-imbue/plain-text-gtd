[project]
name = "gtd"
version = "0.1.0"
description = "GTD-style todo inbox and triage workflow over plain-text markdown files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
]

[project.scripts]
gtd = "gtd.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtd"]
